name: RAG CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # ✅ Build Docker image (FAISS built here via RUN python ingest.py)
      - name: Build Docker image
        run: |
          docker build -t ecommerce-dataset:latest .

      # ✅ Login to Docker Hub using PAT
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ✅ Tag and push image
      - name: Push image
        run: |
          docker tag ecommerce-dataset:latest ${{ secrets.DOCKER_USERNAME }}/ecommerce-dataset:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/ecommerce-dataset:latest
